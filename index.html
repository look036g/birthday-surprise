<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Indira Sinha!</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0118;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Step 1: Initial Question Screen Overlay */
        #questionOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #18032b, #0d0118);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .girly-card {
            background: rgba(255, 192, 203, 0.08);
            padding: 40px 35px;
            border-radius: 28px;
            border: 2px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.3), inset 0 0 15px rgba(255, 182, 193, 0.2);
            text-align: center;
            backdrop-filter: blur(12px);
            max-width: 90%;
            width: 380px;
            animation: cardFloat 3s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        .sparkle-icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: sparkleGlow 1.5s infinite alternate;
        }

        @keyframes sparkleGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ffb6c1); }
            100% { transform: scale(1.18); filter: drop-shadow(0 0 18px #ff69b4); }
        }

        .question-text {
            color: #fff0f5;
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 28px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            position: relative;
            min-height: 50px;
        }

        .yes-btn {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.7);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .yes-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.9);
        }

        .no-btn {
            background: linear-gradient(45deg, #8a2be2, #9370db);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
            transition: all 0.2s ease;
            position: relative;
        }

        /* Step 2: Password Lock Overlay */
        #lockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0118;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .lock-box {
            background: rgba(255, 192, 203, 0.08);
            padding: 35px 40px;
            border-radius: 25px;
            border: 2px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 0 35px rgba(255, 105, 180, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            width: 320px;
        }

        .lock-box h2 {
            color: #fff0f5;
            margin-bottom: 18px;
            font-size: 1.4rem;
            text-shadow: 0 0 12px #ff69b4;
        }

        .lock-box input {
            padding: 12px 18px;
            border-radius: 25px;
            border: 2px solid #ff69b4;
            outline: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .lock-box button {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 18px rgba(255, 20, 147, 0.8);
            transition: transform 0.2s;
        }

        .lock-box button:hover {
            transform: scale(1.05);
        }

        #errorMsg {
            color: #ff4d6d;
            margin-top: 10px;
            font-size: 0.85rem;
            display: none;
        }

        /* Background Animated Glow */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(13, 1, 24, 1) 70%);
            z-index: 1;
        }

        /* MAIN CONTENT */
        #mainContent {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            padding: 40px 20px 100px 20px;
            text-align: center;
            width: 100%;
        }

        #mainContent.show {
            opacity: 1;
            visibility: visible;
        }

        /* Square Card & Glow Effect */
        .square-card {
            position: relative;
            z-index: 2;
            width: 250px;
            height: 250px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            padding: 5px;
            box-shadow: 0 0 35px rgba(255, 65, 108, 0.8), 0 0 70px rgba(255, 0, 85, 0.5);
            animation: pulse 2s infinite alternate ease-in-out;
        }

        .square-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            display: block;
        }

        @keyframes pulse {
            0% { transform: scale(0.96); box-shadow: 0 0 25px rgba(255, 65, 108, 0.7); }
            100% { transform: scale(1.04); box-shadow: 0 0 50px rgba(255, 65, 108, 1), 0 0 80px rgba(255, 0, 128, 0.6); }
        }

        /* Glowing Text */
        .text-container {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 30px;
            padding: 0 15px;
        }

        .main-title {
            color: #fff;
            font-size: 2.3rem;
            font-weight: 800;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff0055, 0 0 40px #ff0055;
            letter-spacing: 1px;
        }

        .sub-title {
            color: #ffb3d9;
            font-size: 1.1rem;
            margin-top: 10px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(255, 179, 217, 0.7);
        }

        /* Typewriter Text Box */
        .typewriter-box {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #e0b0ff;
            min-height: 24px;
            font-style: italic;
            text-shadow: 0 0 5px rgba(224, 176, 255, 0.5);
        }

        /* Interactive Envelopes Section */
        .wishes-section {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .envelope-card {
            background: rgba(255, 105, 180, 0.12);
            border: 1px solid rgba(255, 105, 180, 0.4);
            padding: 12px 18px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.3rem;
            backdrop-filter: blur(8px);
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .envelope-card:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 105, 180, 0.25);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
        }

        /* Modal for Envelope Wish Popups */
        .wish-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 20000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .wish-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .wish-box {
            background: linear-gradient(135deg, #2a0845, #18032b);
            border: 2px solid #ff69b4;
            border-radius: 22px;
            padding: 30px 25px;
            width: 320px;
            max-width: 85%;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 105, 180, 0.6);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .wish-modal.active .wish-box {
            transform: scale(1);
        }

        .wish-box p {
            color: #fff0f5;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .wish-close-btn {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modern Floating Music Player Card */
        .music-player-card {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            background: rgba(255, 105, 180, 0.15);
            border: 1px solid rgba(255, 105, 180, 0.4);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }

        .music-player-card.show {
            opacity: 1;
            visibility: visible;
        }

        .music-icon {
            font-size: 1.2rem;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-info {
            text-align: left;
            color: #fff;
            font-size: 0.8rem;
        }

        .music-info strong {
            display: block;
            color: #ffb3d9;
            font-size: 0.85rem;
        }

        /* Canvas Particle Screen */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Floating Hearts Container */
        #heartsContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 1.5rem;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Step 1: Girly Question Screen -->
    <div id="questionOverlay">
        <div class="girly-card">
            <div class="sparkle-icon">✨</div>
            <div class="question-text">Do you wanna see what I made??</div>
            <div class="btn-group">
                <button class="yes-btn" onclick="proceedToLock()">Yes!</button>
                <button class="no-btn" id="noBtn" onmouseover="dodgeNoBtn()" onclick="dodgeNoBtn()">No</button>
            </div>
        </div>
    </div>

    <!-- Step 2: Password Lock Screen -->
    <div id="lockOverlay">
        <div class="lock-box">
            <h2>🔒 Secret Passcode</h2>
            <input type="password" id="passInput" placeholder="Enter Password">
            <br>
            <button onclick="unlockSurprise()">Unlock ❤️</button>
            <p id="errorMsg">Incorrect Password! Try again.</p>
        </div>
    </div>

    <div class="bg-glow"></div>
    <canvas id="fireworks"></canvas>
    <div id="heartsContainer"></div>

    <!-- Main Content -->
    <div id="mainContent">
        <div class="square-card">
            <img src="photo.jpg" alt="Indira Sinha">
        </div>

        <div class="text-container">
            <h1 class="main-title">Happy Birthday Indira Sinha! 💖</h1>
            <p class="sub-title">I guess no one has ever wished you like this.</p>
            <div class="typewriter-box" id="typewriter"></div>
        </div>

        <!-- Interactive Envelopes -->
        <div class="wishes-section">
            <div class="envelope-card" onclick="openWish(1)">✉️ Note 1</div>
            <div class="envelope-card" onclick="openWish(2)">🎁 Note 2</div>
            <div class="envelope-card" onclick="openWish(3)">💖 Note 3</div>
        </div>
    </div>

    <!-- Envelope Wish Popups -->
    <div class="wish-modal" id="wishModal">
        <div class="wish-box">
            <p id="wishText"></p>
            <button class="wish-close-btn" onclick="closeWish()">Close ❤️</button>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgSong" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <!-- Modern Music Player Card -->
    <div class="music-player-card" id="playerCard" onclick="togglePlay()">
        <div class="music-icon" id="musicDisk">🎵</div>
        <div class="music-info">
            <strong id="songStatus">Playing Music...</strong>
            <span>Click to pause/play</span>
        </div>
    </div>

    <script>
        const SECRET_PASS = "0306";

        // Step 1 -> Step 2
        function proceedToLock() {
            const qOverlay = document.getElementById("questionOverlay");
            const lOverlay = document.getElementById("lockOverlay");
            
            qOverlay.style.opacity = "0";
            qOverlay.style.transform = "scale(1.08)";
            setTimeout(() => {
                qOverlay.style.display = "none";
                lOverlay.style.visibility = "visible";
                lOverlay.style.opacity = "1";
                document.getElementById("passInput").focus();
            }, 500);
        }

        // Dodge effect for "No" button
        function dodgeNoBtn() {
            const noBtn = document.getElementById("noBtn");
            const x = (Math.random() - 0.5) * 220;
            const y = (Math.random() - 0.5) * 160;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Unlock Main Screen
        function unlockSurprise() {
            const userPass = document.getElementById("passInput").value;
            const errorMsg = document.getElementById("errorMsg");
            const lockOverlay = document.getElementById("lockOverlay");
            const mainContent = document.getElementById("mainContent");
            const playerCard = document.getElementById("playerCard");
            const song = document.getElementById("bgSong");

            if (userPass === SECRET_PASS) {
                lockOverlay.style.opacity = "0";
                lockOverlay.style.visibility = "hidden";
                
                mainContent.classList.add("show");
                playerCard.classList.add("show");

                // Music play
                song.play();

                // Trigger Confetti Burst
                triggerConfetti();

                // Start Floating Hearts & Balloons
                startFloatingHearts();

                // Start Typewriter Text
                startTypewriter();
            } else {
                errorMsg.style.display = "block";
            }
        }

        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                unlockSurprise();
            }
        });

        // Confetti Burst Effect
        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff1493', '#ff69b4', '#ffb3d9', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff1493', '#ff69b4', '#ffb3d9', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Floating Hearts & Balloons
        function startFloatingHearts() {
            const container = document.getElementById('heartsContainer');
            const icons = ['💖', '🎈', '✨', '🌸', '💕'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerText = icons[Math.floor(Math.random() * icons.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                container.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 7000);
            }, 400);
        }

        // Typewriter Effect
        const messageText = "May your special day be filled with endless smiles, warmth, and magical moments... ✨";
        let typeIndex = 0;

        function startTypewriter() {
            if (typeIndex < messageText.length) {
                document.getElementById("typewriter").innerHTML += messageText.charAt(typeIndex);
                typeIndex++;
                setTimeout(startTypewriter, 50);
            }
        }

        // Notes / Envelope Popups
        const notes = {
            1: "🌸 May your smile shine brighter than ever today and always! Stay blessed & happy!",
            2: "🎉 Wishing you an unforgettable day packed with joyous surprises and sweet memories!",
            3: "✨ You deserve all the magical things this world has to offer. Happy Birthday, Indira!"
        };

        function openWish(num) {
            document.getElementById("wishText").innerText = notes[num];
            document.getElementById("wishModal").classList.add("active");
        }

        function closeWish() {
            document.getElementById("wishModal").classList.remove("active");
        }

        // Background Sparkle Particle Animation
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];

        for (let i = 0; i < 75; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.2,
                color: '#fff',
                velocity: Math.random() * 0.5 + 0.2
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff69b4";
                ctx.fill();

                p.y -= p.velocity;
                if (p.y < 0) p.y = canvas.height;
            });
        }
        animate();

        // Music Control
        var song = document.getElementById("bgSong");
        var disk = document.getElementById("musicDisk");
        var statusText = document.getElementById("songStatus");

        function togglePlay() {
            if (song.paused) {
                song.play();
                disk.style.animationPlayState = "running";
                statusText.innerText = "Playing Music...";
            } else {
                song.pause();
                disk.style.animationPlayState = "paused";
                statusText.innerText = "Music Paused";
            }
        }
    </script>
</body>
</html>
