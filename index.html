<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0118;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        /* Password Lock Overlay */
        #lockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0118;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .lock-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 51, 102, 0.3);
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .lock-box h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #ff3366;
        }

        .lock-box input {
            padding: 12px 18px;
            border-radius: 25px;
            border: 2px solid #ff3366;
            outline: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .lock-box button {
            background: #ff3366;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.8);
            transition: transform 0.2s, background 0.2s;
        }

        .lock-box button:hover {
            transform: scale(1.05);
            background: #ff1a53;
        }

        #errorMsg {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 0.85rem;
            display: none;
        }

        /* Background Animated Glow */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(13, 1, 24, 1) 70%);
            z-index: 1;
        }

        /* Square Card & Glow Effect */
        .square-card {
            position: relative;
            z-index: 2;
            width: 250px;
            height: 250px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            padding: 5px;
            box-shadow: 0 0 35px rgba(255, 65, 108, 0.8), 0 0 70px rgba(255, 0, 85, 0.5);
            animation: pulse 2s infinite alternate ease-in-out;
        }

        .square-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            display: block;
        }

        @keyframes pulse {
            0% { transform: scale(0.96); box-shadow: 0 0 25px rgba(255, 65, 108, 0.7); }
            100% { transform: scale(1.04); box-shadow: 0 0 50px rgba(255, 65, 108, 1), 0 0 80px rgba(255, 0, 128, 0.6); }
        }

        /* Glowing Text */
        .text-container {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 35px;
        }

        .main-title {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 800;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff0055, 0 0 40px #ff0055;
            letter-spacing: 1px;
        }

        .sub-title {
            color: #ffb3d9;
            font-size: 1.1rem;
            margin-top: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 179, 217, 0.7);
        }

        /* Canvas (Particles) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Music Button */
        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            background: #ff3366;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.8);
            transition: transform 0.2s, background-color 0.2s;
        }

        .music-btn:hover {
            transform: scale(1.05);
            background: #ff1a53;
        }
    </style>
</head>
<body>

    <!-- Password Lock Screen -->
    <div id="lockOverlay">
        <div class="lock-box">
            <h2>🔒 Surprise Locked!</h2>
            <input type="password" id="passInput" placeholder="Enter Secret Password">
            <br>
            <button onclick="unlockSurprise()">Unlock ❤️</button>
            <p id="errorMsg">Incorrect Password! Try again.</p>
        </div>
    </div>

    <div class="bg-glow"></div>
    <canvas id="fireworks"></canvas>

    <!-- Square Photo Card -->
    <div class="square-card">
        <img src="photo.jpg" alt="Birthday Girl">
    </div>

    <!-- Glowing Text -->
    <div class="text-container">
        <h1 class="main-title">Happy Birthday Indira Sinha! 💖</h1>
        <p class="sub-title">I guess no one has ever wished you like this.</p>
    </div>

    <!-- Background Music -->
    <audio id="bgSong" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <!-- Music Control Button -->
    <button class="music-btn" onclick="togglePlay()" id="playBtn">⏸️ Pause Music</button>

    <script>
        // Password set to 0306
        const SECRET_PASS = "0306";

        function unlockSurprise() {
            const userPass = document.getElementById("passInput").value;
            const errorMsg = document.getElementById("errorMsg");
            const lockOverlay = document.getElementById("lockOverlay");
            const song = document.getElementById("bgSong");

            if (userPass === SECRET_PASS) {
                lockOverlay.style.opacity = "0";
                setTimeout(() => {
                    lockOverlay.style.visibility = "hidden";
                }, 800);

                song.play();
            } else {
                errorMsg.style.display = "block";
            }
        }

        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                unlockSurprise();
            }
        });

        // Background Sparkle Animation
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];

        for (let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2,
                color: '#fff',
                velocity: Math.random() * 0.5 + 0.2
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff3366";
                ctx.fill();

                p.y -= p.velocity;
                if (p.y < 0) p.y = canvas.height;
            });
        }
        animate();

        // Music Control
        var song = document.getElementById("bgSong");
        var btn = document.getElementById("playBtn");

        function togglePlay() {
            if (song.paused) {
                song.play();
                btn.innerHTML = "⏸️ Pause Music";
            } else {
                song.pause();
                btn.innerHTML = "🎵 Play Music";
            }
        }
    </script>
</body>
</html>
